name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - run: pip install pytest sympy numpy
      - run: python -m pytest -q tests

  package:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .skill archive
        run: zip -r buku-praktikum.skill buku-praktikum -x '*/__pycache__/*'
      - uses: actions/upload-artifact@v4
        with:
          name: buku-praktikum-skill
          path: buku-praktikum.skill
